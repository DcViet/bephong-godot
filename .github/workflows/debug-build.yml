name: Debug build (Windows)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
      - name: Import
        run: godot --headless --path . --import
      - name: Smoke test
        run: godot --headless --path . -s res://tools/smoke_test.gd
      - name: Test hệ thống xây dựng
        run: godot --headless --path . -s res://tools/building_test.gd

  export-windows-debug:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cài Godot và export template
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$tpl"
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* "$tpl/"
      - name: Import
        run: godot --headless --path . --import
      - name: Export bản debug
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Windows Desktop" build/BePhong.exe
          ls -la build
      - name: Export bản web (không thread, chạy được trên GitHub Pages)
        run: |
          mkdir -p build/web
          godot --headless --path . --export-debug "Web" build/web/index.html
          ls -la build/web
      - name: Đóng gói
        run: |
          cd build && zip -q ../BePhong-windows-debug.zip BePhong*
          ls -la ../BePhong-windows-debug.zip
      - name: Đăng lên Release "debug-latest"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Bản debug Windows dựng từ commit ${GITHUB_SHA::7}. Tự cập nhật mỗi lần push vào main."
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release edit debug-latest --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create debug-latest --prerelease --title "Bản debug mới nhất" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload debug-latest BePhong-windows-debug.zip --clobber
      - name: Đăng bản web lên nhánh gh-pages
        if: github.event_name != 'pull_request'
        run: |
          cd build/web
          touch .nojekyll
          # Godot đặt tên file theo index.*; GitHub Pages phục vụ index.html là trang chính.
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Bản web từ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
